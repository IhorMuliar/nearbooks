[package]
name = "nearbooks"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "On-chain metric snapshots and dated falsifiable predictions for the NEAR Books audit"
rust-version = "1.86"
# NEP-330: embedded in the wasm (`contract_source_metadata`) by cargo-near; part of the reproducible build's input.
repository = "https://github.com/IhorMuliar/nearbooks"

[lib]
crate-type = ["cdylib", "rlib"]

# `cargo near build reproducible-wasm` (NEP-330): builds the committed HEAD in this image, identified by its digest.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]

[dependencies]
near-sdk = "~5.29"

[dev-dependencies]
near-sdk = { version = "~5.29", features = ["unit-testing"] }


[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
